<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Verbal Reasoning Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: white; border-radius: 28px;
            padding: 36px 30px; max-width: 540px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .score-display { font-size: 20px; font-weight: bold; color: #333; }
        .q-counter { font-size: 15px; color: #999; font-weight: bold; }
        .category-badge {
            display: inline-block; background: #f3e8ff;
            color: #7c3aed; font-size: 13px; font-weight: bold;
            padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
        }
        .progress {
            width: 100%; height: 10px; background: #f0d8ff;
            border-radius: 5px; margin-bottom: 24px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #a18cd1, #fbc2eb);
            border-radius: 5px; transition: width 0.4s;
        }
        .subject-icon { font-size: 60px; text-align: center; margin-bottom: 6px; }
        h1 { text-align: center; font-size: 24px; color: #555; margin-bottom: 20px; }
        .question {
            font-size: 22px; font-weight: bold; text-align: center;
            color: #222; margin-bottom: 28px; min-height: 70px;
            line-height: 1.5;
        }
        .options {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 20px;
        }
        .option-btn {
            padding: 16px 12px; font-size: 19px; font-weight: bold;
            border: 3px solid #e8d0ff; border-radius: 16px;
            cursor: pointer; background: #fdf8ff;
            transition: all 0.15s; color: #333;
            font-family: Arial, Helvetica, sans-serif; line-height: 1.3;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #a18cd1; background: #f5eeff; transform: scale(1.03);
        }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong   { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .feedback {
            text-align: center; font-size: 24px;
            min-height: 36px; margin-bottom: 12px; font-weight: bold;
        }
        .back-btn {
            display: block; text-align: center; margin-top: 14px;
            color: #bbb; text-decoration: none; font-size: 15px;
        }
        .back-btn:hover { color: #888; }
        .end-screen { display: none; text-align: center; }
        .end-screen .big-emoji { font-size: 90px; margin: 16px 0; }
        .end-screen h2 { font-size: 32px; margin-bottom: 14px; color: #333; }
        .end-screen .final-score { font-size: 22px; color: #666; margin-bottom: 28px; }
        .restart-btn {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            color: white; border: none; padding: 16px 36px;
            border-radius: 14px; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(161,140,209,0.4);
        }
        .restart-btn:hover { opacity: 0.85; }
        .stars-row { font-size: 36px; letter-spacing: 6px; margin: 10px 0 20px; }
    </style>
</head>
<body>
<div class="card">
    <div id="quiz-screen">
        <div class="header">
            <span class="score-display">⭐ <span id="score">0</span></span>
            <span class="q-counter">Q <span id="qnum">1</span> / 10</span>
        </div>
        <div class="progress">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="subject-icon">📝</div>
        <h1>Verbal Reasoning</h1>
        <div class="category-badge" id="category-badge">Odd One Out</div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <a href="index.html" class="back-btn">← Learning Centre</a>
    </div>

    <div class="end-screen" id="end-screen">
        <div class="big-emoji" id="end-emoji">🎉</div>
        <div class="stars-row" id="stars-row"></div>
        <h2 id="end-title">Well Done!</h2>
        <div class="final-score" id="final-score"></div>
        <button class="restart-btn" onclick="startQuiz()">Play Again 🔄</button>
        <br>
        <a href="index.html" class="back-btn" style="margin-top:16px;">← Learning Centre</a>
    </div>
</div>

<script>
const ALL_QUESTIONS = [
    /* Odd One Out */
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nApple 🍎 · Banana 🍌 · Orange 🍊 · Chair 🪑", options: ["Apple","Banana","Orange","Chair"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nRed · Blue · Green · Happy", options: ["Red","Blue","Green","Happy"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nDog 🐕 · Cat 🐈 · Fish 🐟 · Bicycle 🚲", options: ["Dog","Cat","Fish","Bicycle"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nCircle · Square · Triangle · Monday", options: ["Circle","Square","Triangle","Monday"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nRun · Jump · Swim · Book 📚", options: ["Run","Jump","Swim","Book"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nCarrot 🥕 · Potato 🥔 · Broccoli 🥦 · Lion 🦁", options: ["Carrot","Potato","Broccoli","Lion"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which one does NOT belong?\nPiano 🎹 · Guitar 🎸 · Drum 🥁 · Pencil ✏️", options: ["Piano","Guitar","Drum","Pencil"], answer: 3 },

    /* Rhyming Words */
    { cat: "🎵 Rhyming Words", q: "Which word rhymes with CAT?", options: ["Dog","Bat","Fish","Tree"], answer: 1 },
    { cat: "🎵 Rhyming Words", q: "Which word rhymes with BALL?", options: ["Jump","Run","Fall","Skip"], answer: 2 },
    { cat: "🎵 Rhyming Words", q: "Which word rhymes with NIGHT?", options: ["Day","Sun","Cloud","Light"], answer: 3 },
    { cat: "🎵 Rhyming Words", q: "Which word rhymes with RAIN?", options: ["Snow","Wind","Train","Cloud"], answer: 2 },
    { cat: "🎵 Rhyming Words", q: "Which word rhymes with STAR?", options: ["Moon","Car","Sun","Sky"], answer: 1 },
    { cat: "🎵 Rhyming Words", q: "Which word rhymes with CAKE?", options: ["Pie","Bread","Lake","Cookie"], answer: 2 },

    /* Opposites */
    { cat: "🔄 Opposites", q: "What is the opposite of HOT? 🌡️", options: ["Warm","Wet","Cold","Big"], answer: 2 },
    { cat: "🔄 Opposites", q: "What is the opposite of BIG? 🐘", options: ["Tall","Small","Wide","Fat"], answer: 1 },
    { cat: "🔄 Opposites", q: "What is the opposite of FAST? 🐇", options: ["Strong","Slow","Weak","Thin"], answer: 1 },
    { cat: "🔄 Opposites", q: "What is the opposite of DAY? ☀️", options: ["Sun","Moon","Night","Star"], answer: 2 },
    { cat: "🔄 Opposites", q: "What is the opposite of HAPPY? 😊", options: ["Tired","Angry","Sad","Bored"], answer: 2 },
    { cat: "🔄 Opposites", q: "What is the opposite of SOFT? 🐑", options: ["Light","Hard","Heavy","Rough"], answer: 1 },
    { cat: "🔄 Opposites", q: "What is the opposite of UP? ⬆️", options: ["Left","Down","Right","Side"], answer: 1 },

    /* Analogies */
    { cat: "🧩 Analogy", q: "Dog is to Puppy\nas Cat is to ___?", options: ["Cub","Kitten","Lamb","Calf"], answer: 1 },
    { cat: "🧩 Analogy", q: "Sun is to Day\nas Moon is to ___?", options: ["Star","Sky","Night","Rain"], answer: 2 },
    { cat: "🧩 Analogy", q: "Foot is to Shoe\nas Head is to ___?", options: ["Scarf","Glove","Sock","Hat"], answer: 3 },
    { cat: "🧩 Analogy", q: "Fish is to Sea 🐟\nas Bird is to ___?", options: ["Tree","Sky","Cage","Garden"], answer: 1 },
    { cat: "🧩 Analogy", q: "Book is to Read 📚\nas Song is to ___?", options: ["Dance","Write","Sing","Draw"], answer: 2 },
    { cat: "🧩 Analogy", q: "Ice is to Cold ❄️\nas Fire is to ___?", options: ["Red","Hot","Smoke","Bright"], answer: 1 },
];

const TOTAL = 10;
const PRAISE = ['🎉 Brilliant!','⭐ Correct!','🌟 Amazing!','🎊 Great job!','🧠 Smart thinking!'];
let score = 0, qnum = 0, locked = false;
let questions = [], correct_answer;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function showQuestion() {
    locked = false;
    const q = questions[qnum];
    correct_answer = q.options[q.answer];
    const shuffledOpts = shuffle(q.options);

    document.getElementById('question').textContent = q.q;
    document.getElementById('category-badge').textContent = q.cat;
    document.getElementById('feedback').textContent = '';
    document.getElementById('qnum').textContent = qnum + 1;
    document.getElementById('progress-fill').style.width = (qnum / TOTAL * 100) + '%';

    const container = document.getElementById('options');
    container.innerHTML = '';
    shuffledOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => pick(btn, opt, container);
        container.appendChild(btn);
    });
}

function pick(btn, selected, container) {
    if (locked) return;
    locked = true;
    container.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        if (b.textContent === correct_answer) b.classList.add('correct');
    });
    if (selected === correct_answer) {
        btn.classList.add('correct');
        document.getElementById('feedback').textContent = PRAISE[randInt(0, PRAISE.length - 1)];
        score++;
        document.getElementById('score').textContent = score;
    } else {
        btn.classList.add('wrong');
        document.getElementById('feedback').textContent = `❌ Answer: ${correct_answer}`;
    }
    qnum++;
    setTimeout(qnum >= TOTAL ? showEnd : showQuestion, 1700);
}

function showEnd() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    const pct = Math.round(score / TOTAL * 100);
    let emoji = '😊', title = 'Keep Practising!';
    const stars = Math.round(score / TOTAL * 5);
    if (pct >= 90) { emoji = '🏆'; title = "Word Wizard! 🧙"; }
    else if (pct >= 70) { emoji = '🎉'; title = 'Well Done!'; }
    else if (pct >= 50) { emoji = '👍'; title = 'Good Try!'; }
    document.getElementById('end-emoji').textContent = emoji;
    document.getElementById('end-title').textContent = title;
    document.getElementById('final-score').textContent = `You got ${score} out of ${TOTAL}! (${pct}%)`;
    document.getElementById('stars-row').textContent = '⭐'.repeat(stars) + '☆'.repeat(5 - stars);
}

function startQuiz() {
    score = 0; qnum = 0;
    questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL);
    document.getElementById('score').textContent = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('end-screen').style.display = 'none';
    showQuestion();
}

startQuiz();
</script>
</body>
</html>
