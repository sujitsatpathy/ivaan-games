<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Country Capitals Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0acffe 0%, #495aff 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: white; border-radius: 28px;
            padding: 36px 30px; max-width: 520px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.22);
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .score-display { font-size: 20px; font-weight: bold; color: #333; }
        .q-counter { font-size: 15px; color: #999; font-weight: bold; }
        .progress {
            width: 100%; height: 10px; background: #d0e4ff;
            border-radius: 5px; margin-bottom: 24px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #0acffe, #495aff);
            border-radius: 5px; transition: width 0.4s;
        }
        .subject-icon { font-size: 60px; text-align: center; margin-bottom: 6px; }
        h1 { text-align: center; font-size: 24px; color: #555; margin-bottom: 24px; }
        .question {
            font-size: 22px; font-weight: bold; text-align: center;
            color: #222; margin-bottom: 28px; min-height: 60px;
            line-height: 1.4;
        }
        .options {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 20px;
        }
        .option-btn {
            padding: 16px 10px; font-size: 18px; font-weight: bold;
            border: 3px solid #ccd8ff; border-radius: 16px;
            cursor: pointer; background: #f5f7ff;
            transition: all 0.15s; color: #333;
            font-family: Arial, Helvetica, sans-serif; line-height: 1.3;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #495aff; background: #eef0ff; transform: scale(1.03);
        }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong   { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .feedback {
            text-align: center; font-size: 24px;
            min-height: 36px; margin-bottom: 12px; font-weight: bold;
        }
        .back-btn {
            display: block; text-align: center; margin-top: 14px;
            color: #bbb; text-decoration: none; font-size: 15px;
        }
        .back-btn:hover { color: #888; }
        .end-screen { display: none; text-align: center; }
        .end-screen .big-emoji { font-size: 90px; margin: 16px 0; }
        .end-screen h2 { font-size: 32px; margin-bottom: 14px; color: #333; }
        .end-screen .final-score { font-size: 22px; color: #666; margin-bottom: 28px; }
        .restart-btn {
            background: linear-gradient(135deg, #0acffe, #495aff);
            color: white; border: none; padding: 16px 36px;
            border-radius: 14px; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(73,90,255,0.4);
        }
        .restart-btn:hover { opacity: 0.85; }
        .stars-row { font-size: 36px; letter-spacing: 6px; margin: 10px 0 20px; }
    </style>
</head>
<body>
<div class="card">
    <div id="quiz-screen">
        <div class="header">
            <span class="score-display">⭐ <span id="score">0</span></span>
            <span class="q-counter">Q <span id="qnum">1</span> / 10</span>
        </div>
        <div class="progress">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="subject-icon">🌍</div>
        <h1>Country Capitals Quiz</h1>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <a href="index.html" class="back-btn">← Learning Centre</a>
    </div>

    <div class="end-screen" id="end-screen">
        <div class="big-emoji" id="end-emoji">🎉</div>
        <div class="stars-row" id="stars-row"></div>
        <h2 id="end-title">Well Done!</h2>
        <div class="final-score" id="final-score"></div>
        <button class="restart-btn" onclick="startQuiz()">Play Again 🔄</button>
        <br>
        <a href="index.html" class="back-btn" style="margin-top:16px;">← Learning Centre</a>
    </div>
</div>

<script>
const ALL_QUESTIONS = [
    { q: "🇫🇷 What is the capital of France?",          options: ["Paris","Lyon","Rome","Madrid"],            answer: 0 },
    { q: "🇬🇧 What is the capital of the United Kingdom?", options: ["Manchester","Edinburgh","London","Birmingham"], answer: 2 },
    { q: "🇮🇹 What is the capital of Italy?",           options: ["Milan","Venice","Naples","Rome"],           answer: 3 },
    { q: "🇩🇪 What is the capital of Germany?",         options: ["Munich","Berlin","Hamburg","Frankfurt"],    answer: 1 },
    { q: "🇯🇵 What is the capital of Japan?",           options: ["Osaka","Kyoto","Tokyo","Hiroshima"],        answer: 2 },
    { q: "🇦🇺 What is the capital of Australia?",       options: ["Sydney","Melbourne","Brisbane","Canberra"], answer: 3 },
    { q: "🇺🇸 What is the capital of the USA?",         options: ["New York","Washington D.C.","Los Angeles","Chicago"], answer: 1 },
    { q: "🇧🇷 What is the capital of Brazil?",          options: ["Rio de Janeiro","São Paulo","Brasília","Salvador"], answer: 2 },
    { q: "🇮🇳 What is the capital of India?",           options: ["Mumbai","New Delhi","Kolkata","Chennai"],   answer: 1 },
    { q: "🇨🇳 What is the capital of China?",           options: ["Shanghai","Beijing","Guangzhou","Shenzhen"], answer: 1 },
    { q: "🇪🇸 What is the capital of Spain?",           options: ["Barcelona","Seville","Valencia","Madrid"],  answer: 3 },
    { q: "🇷🇺 What is the capital of Russia?",          options: ["Moscow","St Petersburg","Novosibirsk","Kazan"], answer: 0 },
    { q: "🇨🇦 What is the capital of Canada?",          options: ["Toronto","Vancouver","Montreal","Ottawa"],  answer: 3 },
    { q: "🇲🇽 What is the capital of Mexico?",          options: ["Guadalajara","Monterrey","Mexico City","Cancún"], answer: 2 },
    { q: "🇪🇬 What is the capital of Egypt?",           options: ["Alexandria","Cairo","Luxor","Aswan"],       answer: 1 },
    { q: "🇳🇱 What is the capital of the Netherlands?", options: ["Rotterdam","Utrecht","The Hague","Amsterdam"], answer: 3 },
    { q: "🇵🇹 What is the capital of Portugal?",        options: ["Porto","Lisbon","Braga","Faro"],            answer: 1 },
    { q: "🇦🇷 What is the capital of Argentina?",       options: ["Córdoba","Buenos Aires","Rosario","Mendoza"], answer: 1 },
    { q: "🇰🇷 What is the capital of South Korea?",     options: ["Busan","Incheon","Seoul","Daegu"],          answer: 2 },
    { q: "🇹🇷 What is the capital of Turkey?",          options: ["Istanbul","Ankara","Izmir","Antalya"],      answer: 1 },
    { q: "🇬🇷 What is the capital of Greece?",          options: ["Thessaloniki","Athens","Patras","Heraklion"], answer: 1 },
    { q: "🇳🇴 What is the capital of Norway?",          options: ["Bergen","Oslo","Trondheim","Stavanger"],    answer: 1 },
    { q: "🇸🇪 What is the capital of Sweden?",          options: ["Göteborg","Malmö","Uppsala","Stockholm"],   answer: 3 },
    { q: "🇵🇱 What is the capital of Poland?",          options: ["Kraków","Warsaw","Gdańsk","Łódź"],          answer: 1 },
    { q: "🇰🇪 What is the capital of Kenya?",           options: ["Mombasa","Nairobi","Kisumu","Eldoret"],     answer: 1 },
    { q: "🇹🇭 What is the capital of Thailand?",        options: ["Chiang Mai","Phuket","Bangkok","Pattaya"],  answer: 2 },
    { q: "🇮🇩 What is the capital of Indonesia?",       options: ["Surabaya","Jakarta","Bandung","Medan"],     answer: 1 },
    { q: "🇵🇭 What is the capital of the Philippines?", options: ["Cebu","Manila","Davao","Quezon City"],      answer: 1 },
    { q: "🇲🇾 What is the capital of Malaysia?",        options: ["Penang","Johor Bahru","Kuala Lumpur","Ipoh"], answer: 2 },
    { q: "🇳🇬 What is the capital of Nigeria?",         options: ["Lagos","Kano","Abuja","Ibadan"],            answer: 2 },
];

const TOTAL = 10;
const PRAISE = ['🎉 Brilliant!','⭐ Correct!','🌟 Amazing!','🎊 Great job!','🗺️ Geography star!'];
let score = 0, qnum = 0, locked = false;
let questions = [], correct_answer;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function showQuestion() {
    locked = false;
    const q = questions[qnum];
    correct_answer = q.options[q.answer];
    const shuffledOpts = shuffle(q.options);

    document.getElementById('question').textContent = q.q;
    document.getElementById('feedback').textContent = '';
    document.getElementById('qnum').textContent = qnum + 1;
    document.getElementById('progress-fill').style.width = (qnum / TOTAL * 100) + '%';

    const container = document.getElementById('options');
    container.innerHTML = '';
    shuffledOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => pick(btn, opt, container);
        container.appendChild(btn);
    });
}

function pick(btn, selected, container) {
    if (locked) return;
    locked = true;
    container.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        if (b.textContent === correct_answer) b.classList.add('correct');
    });
    if (selected === correct_answer) {
        btn.classList.add('correct');
        document.getElementById('feedback').textContent = PRAISE[randInt(0, PRAISE.length - 1)];
        score++;
        document.getElementById('score').textContent = score;
    } else {
        btn.classList.add('wrong');
        document.getElementById('feedback').textContent = `❌ It's ${correct_answer}`;
    }
    qnum++;
    setTimeout(qnum >= TOTAL ? showEnd : showQuestion, 1700);
}

function showEnd() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    const pct = Math.round(score / TOTAL * 100);
    let emoji = '😊', title = 'Keep Practising!';
    const stars = Math.round(score / TOTAL * 5);
    if (pct >= 90) { emoji = '🏆'; title = "World Expert! 🌍"; }
    else if (pct >= 70) { emoji = '🎉'; title = 'Well Done!'; }
    else if (pct >= 50) { emoji = '👍'; title = 'Good Try!'; }
    document.getElementById('end-emoji').textContent = emoji;
    document.getElementById('end-title').textContent = title;
    document.getElementById('final-score').textContent = `You got ${score} out of ${TOTAL}! (${pct}%)`;
    document.getElementById('stars-row').textContent = '⭐'.repeat(stars) + '☆'.repeat(5 - stars);
}

function startQuiz() {
    score = 0; qnum = 0;
    questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL);
    document.getElementById('score').textContent = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('end-screen').style.display = 'none';
    showQuestion();
}

startQuiz();
</script>
</body>
</html>
