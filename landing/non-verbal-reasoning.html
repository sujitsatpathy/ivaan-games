<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔷 Non-Verbal Reasoning Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: white; border-radius: 28px;
            padding: 36px 30px; max-width: 540px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .score-display { font-size: 20px; font-weight: bold; color: #333; }
        .q-counter { font-size: 15px; color: #999; font-weight: bold; }
        .category-badge {
            display: inline-block; background: #fde8f5;
            color: #c026a3; font-size: 13px; font-weight: bold;
            padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
        }
        .progress {
            width: 100%; height: 10px; background: #fdd8f0;
            border-radius: 5px; margin-bottom: 24px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb, #f5576c);
            border-radius: 5px; transition: width 0.4s;
        }
        .subject-icon { font-size: 60px; text-align: center; margin-bottom: 6px; }
        h1 { text-align: center; font-size: 24px; color: #555; margin-bottom: 20px; }
        .question {
            font-size: 24px; font-weight: bold; text-align: center;
            color: #222; margin-bottom: 28px; min-height: 70px;
            line-height: 1.6; letter-spacing: 2px;
        }
        .hint {
            font-size: 14px; color: #888; text-align: center;
            margin-top: -18px; margin-bottom: 20px; font-style: italic;
        }
        .options {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 20px;
        }
        .option-btn {
            padding: 18px 12px; font-size: 22px; font-weight: bold;
            border: 3px solid #f8d0ee; border-radius: 16px;
            cursor: pointer; background: #fff8fd;
            transition: all 0.15s; color: #333;
            font-family: Arial, Helvetica, sans-serif; line-height: 1.3;
            letter-spacing: 1px;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #f093fb; background: #fff0fb; transform: scale(1.03);
        }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong   { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .feedback {
            text-align: center; font-size: 24px;
            min-height: 36px; margin-bottom: 12px; font-weight: bold;
        }
        .back-btn {
            display: block; text-align: center; margin-top: 14px;
            color: #bbb; text-decoration: none; font-size: 15px;
        }
        .back-btn:hover { color: #888; }
        .end-screen { display: none; text-align: center; }
        .end-screen .big-emoji { font-size: 90px; margin: 16px 0; }
        .end-screen h2 { font-size: 32px; margin-bottom: 14px; color: #333; }
        .end-screen .final-score { font-size: 22px; color: #666; margin-bottom: 28px; }
        .restart-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white; border: none; padding: 16px 36px;
            border-radius: 14px; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(240,147,251,0.45);
        }
        .restart-btn:hover { opacity: 0.85; }
        .stars-row { font-size: 36px; letter-spacing: 6px; margin: 10px 0 20px; }
    </style>
</head>
<body>
<div class="card">
    <div id="quiz-screen">
        <div class="header">
            <span class="score-display">⭐ <span id="score">0</span></span>
            <span class="q-counter">Q <span id="qnum">1</span> / 10</span>
        </div>
        <div class="progress">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="subject-icon">🔷</div>
        <h1>Non-Verbal Reasoning</h1>
        <div class="category-badge" id="category-badge">Number Sequence</div>
        <div class="question" id="question"></div>
        <div class="hint" id="hint"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <a href="index.html" class="back-btn">← Learning Centre</a>
    </div>

    <div class="end-screen" id="end-screen">
        <div class="big-emoji" id="end-emoji">🎉</div>
        <div class="stars-row" id="stars-row"></div>
        <h2 id="end-title">Well Done!</h2>
        <div class="final-score" id="final-score"></div>
        <button class="restart-btn" onclick="startQuiz()">Play Again 🔄</button>
        <br>
        <a href="index.html" class="back-btn" style="margin-top:16px;">← Learning Centre</a>
    </div>
</div>

    /* ── Colour Patterns ── */
    { cat: "🎨 Colour Pattern", q: "🔴  🔵  🔴  🔵  🔴  __?",          hint: "Alternating colours",            options: ["🔴","🔵","🟡","🟢"], answer: 1 },
    { cat: "🎨 Colour Pattern", q: "🟡  🟢  🟡  🟢  🟡  __?",          hint: "Alternating colours",            options: ["🔴","🔵","🟡","🟢"], answer: 3 },

    { cat: "🎨 Colour Pattern", q: "🔴  🟡  🔵  🔴  🟡  __?",          hint: "Look at the repeating colours",  options: ["🔴","🟡","🔵","🟢"], answer: 2 },
    { cat: "🎨 Colour Pattern", q: "🟢  🟢  🔴  🟢  🟢  __?",          hint: "Look at the groups",             options: ["🔴","🟢","🔵","🟡"], answer: 0 },
    { cat: "🎨 Colour Pattern", q: "🔵  🟡  🔵  🟡  🔵  __?",          hint: "Alternating colours",            options: ["🔵","🟡","🔴","🟢"], answer: 1 },
    { cat: "🎨 Colour Pattern", q: "🟣  🟠  🟣  🟠  🟣  __?",          hint: "Alternating colours",            options: ["🟣","🟠","🔵","🟡"], answer: 1 },

    { cat: "🎨 Shape Pattern", q: "⭐  ⭐  💎  ⭐  ⭐  💎  __?",        hint: "Pattern repeats every 3",        options: ["⭐","💎","🔶","🌟"], answer: 0 },
    { cat: "🎨 Shape Pattern", q: "🟦  🔺  🟦  🔺  🟦  __?",            hint: "Alternating shapes",             options: ["🟦","🔺","🔵","🔶"], answer: 1 },

    /* ── Animal Patterns ── */
    { cat: "🐾 Animal Pattern", q: "🐶  🐱  🐶  🐱  🐶  __?",          hint: "Alternating animals",             options: ["🐶","🐱","🐟","🐰"], answer: 1 },
    { cat: "🐾 Animal Pattern", q: "🦁  🐘  🦒  🦁  🐘  __?",          hint: "The animals repeat in order",     options: ["🦁","🐘","🦒","🐬"], answer: 2 },
    { cat: "🐾 Animal Pattern", q: "🐶  🐶  🐱  🐶  🐶  __?",          hint: "Look at the groups",              options: ["🐶","🐱","🐟","🐰"], answer: 1 },
    { cat: "🐾 Animal Pattern", q: "🐘  🦒  🦁  🐘  🦒  __?",          hint: "The animals repeat in order",     options: ["🐘","🦒","🦁","🐬"], answer: 2 },
    { cat: "🐾 Animal Pattern", q: "🐸  🐢  🐸  🐢  🐸  __?",          hint: "Alternating animals",             options: ["🐸","🐢","🦊","🐰"], answer: 1 },
    { cat: "🐾 Animal Pattern", q: "🦋  🐝  🐛  🦋  🐝  __?",          hint: "The animals repeat in order",     options: ["🦋","🐝","🐛","🐞"], answer: 2 },
    { cat: "🐾 Animal Pattern", q: "🐬  🐬  🦈  🐬  🐬  __?",          hint: "Look at the groups",              options: ["🐬","🦈","🐟","🐙"], answer: 1 },

    /* ── Odd One Out ── */
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🍎  🍌  🍇  🥕",   hint: "One of these is not a fruit",     options: ["🍎","🍌","🍇","🥕"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🚗  🚌  🚂  🍕",   hint: "One of these is not a vehicle",   options: ["🚗","🚌","🚂","🍕"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🐶  🐱  🌹  🐟",   hint: "One of these is not an animal",   options: ["🐶","🐱","🌹","🐟"], answer: 2 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n⚽  🎾  🏀  🎸",   hint: "One of these is not a ball",      options: ["⚽","🎾","🏀","🎸"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n✏️  📏  🖊️  🍔",   hint: "One of these is not stationery",  options: ["✏️","📏","🖊️","🍔"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🌧️  ⛅  🌈  🚀",  hint: "One of these is not weather",     options: ["🌧️","⛅","🌈","🚀"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🍰  🎂  🍩  🥦",   hint: "One of these is not a sweet",     options: ["🍰","🎂","🍩","🥦"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🎸  🎹  🎺  📚",   hint: "One of these is not an instrument",options: ["🎸","🎹","🎺","📚"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🌍  🌎  🌏  🚀",   hint: "One of these is not a planet",    options: ["🌍","🌎","🌏","🚀"], answer: 3 },
    { cat: "🔍 Odd One Out", q: "Which is the odd one out?\n🦅  🦆  🐧  🐠",   hint: "One of these is not a bird",      options: ["🦅","🦆","🐧","🐠"], answer: 3 },

    /* ── Count the Shapes ── */
    { cat: "🔢 Count the Shapes", q: "⭐⭐⭐⭐⭐⭐⭐\nHow many stars?",           hint: "Count carefully!",   options: ["5","6","7","8"],     answer: 2 },
    { cat: "🔢 Count the Shapes", q: "🍎🍎🍎🍎🍎🍎🍎🍎🍎\nHow many apples?",    hint: "Count carefully!",   options: ["7","8","9","10"],    answer: 2 },
    { cat: "🔢 Count the Shapes", q: "🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵\nHow many circles?", hint: "Count carefully!", options: ["9","10","11","12"],  answer: 2 },

    { cat: "🧩 What Comes Next?", q: "36,  49,  64,  81,  __?", hint: "6²=36, 7²=49, 8²=64, 9²=81...",       options: ["90","99","100","121"], answer: 2 },

    { cat: "🧩 What Comes Next?", q: "5,  10,  20,  40,  __?", hint: "Double the number each time",           options: ["60","70","80","100"],  answer: 2 },

];

const TOTAL = 10;
const PRAISE = ['🎉 Brilliant!','⭐ Correct!','🌟 Amazing!','🎊 Great job!','🧩 Pattern master!'];
let score = 0, qnum = 0, locked = false;
let questions = [], correct_answer;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function showQuestion() {
    locked = false;
    const q = questions[qnum];
    correct_answer = q.options[q.answer];

    const isShuffle = q.cat.includes('Colour') || q.cat.includes('Animal') || q.cat.includes('Shape') || q.cat.includes('Odd');
    const displayOpts = isShuffle ? shuffle(q.options) : q.options;

    document.getElementById('question').textContent = q.q;
    document.getElementById('category-badge').textContent = q.cat;
    document.getElementById('hint').textContent = q.hint ? `💡 Hint: ${q.hint}` : '';
    document.getElementById('feedback').textContent = '';
    document.getElementById('qnum').textContent = qnum + 1;
    document.getElementById('progress-fill').style.width = (qnum / TOTAL * 100) + '%';

    const container = document.getElementById('options');
    container.innerHTML = '';
    displayOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => pick(btn, opt, container);
        container.appendChild(btn);
    });
}

function pick(btn, selected, container) {
    if (locked) return;
    locked = true;
    container.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        if (b.textContent === correct_answer) b.classList.add('correct');
    });
    if (selected === correct_answer) {
        btn.classList.add('correct');
        document.getElementById('feedback').textContent = PRAISE[randInt(0, PRAISE.length - 1)];
        score++;
        document.getElementById('score').textContent = score;
    } else {
        btn.classList.add('wrong');
        document.getElementById('feedback').textContent = `❌ Answer: ${correct_answer}`;
    }
    qnum++;
    setTimeout(qnum >= TOTAL ? showEnd : showQuestion, 1700);
}

function showEnd() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    const pct = Math.round(score / TOTAL * 100);
    let emoji = '😊', title = 'Keep Practising!';
    const stars = Math.round(score / TOTAL * 5);
    if (pct >= 90) { emoji = '🏆'; title = "Pattern Genius! 🧩"; }
    else if (pct >= 70) { emoji = '🎉'; title = 'Well Done!'; }
    else if (pct >= 50) { emoji = '👍'; title = 'Good Try!'; }
    document.getElementById('end-emoji').textContent = emoji;
    document.getElementById('end-title').textContent = title;
    document.getElementById('final-score').textContent = `You got ${score} out of ${TOTAL}! (${pct}%)`;
    document.getElementById('stars-row').textContent = '⭐'.repeat(stars) + '☆'.repeat(5 - stars);
}

function startQuiz() {
    score = 0; qnum = 0;
    questions = shuffle(ALL_QUESTIONS).slice(0, TOTAL);
    document.getElementById('score').textContent = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('end-screen').style.display = 'none';
    showQuestion();
}

startQuiz();
</script>
</body>
</html>
